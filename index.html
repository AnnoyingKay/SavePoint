<!doctype html>
<html lang="en" data-tab="library">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SavePoint</title>
<meta name="theme-color" content="#0d1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SavePoint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{--bg:#0d1030;--surface:#171b4a;--surface2:#20266a;--text:#eef1ff;--muted:#9aa3d9;--accent:#7fd4ff;--accent2:#b388ff;--onacc:#07102a;--border:#ffffff24;--r:14px;--nav:64px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

/* error bar + debug */
#errbar{position:fixed;top:0;left:0;right:0;z-index:99999;background:#c62828;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:8px;align-items:flex-start;font:13px/1.35 system-ui,sans-serif}
#errtxt{flex:1;word-break:break-word}
#errbar button{background:#ffffff33;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
#dbg{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:99998;max-height:26dvh;opacity:.94;background:#000d;color:#9f9;font:11px/1.3 ui-monospace,Menlo,monospace;display:flex;flex-direction:column}
@media(min-width:1100px){#dbg{bottom:0;left:220px}}
#dbg .bar{display:flex;gap:6px;padding:4px 6px;background:#222;color:#fff}
#dbg .bar button{background:#444;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px}
#dbg pre{margin:0;padding:4px 6px;overflow:auto;white-space:pre-wrap;word-break:break-all;flex:1}

/* shell */
#app{min-height:100dvh;display:flex}
main{flex:1;min-width:0;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom))}
.side{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav);color:var(--muted);font-size:11px}
.navbtn svg{width:24px;height:24px}
.navbtn.on{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding:12px 14px}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--border)}
.topin{max-width:1200px;margin:0 auto}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;flex:1}
.brand svg{width:22px;height:22px}
.toptab{color:var(--muted);font-size:14px}
.searchrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.searchrow input{flex:1 1 100%}
.searchrow .tbtn{flex:1;padding:8px 10px}
@media(min-width:700px){.searchrow{flex-wrap:nowrap}.searchrow input{flex:1 1 auto}.searchrow .tbtn{flex:none;padding:0 12px}}
html:not([data-tab=library]) .searchrow{display:none}
.searchrow input{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none}
.searchrow input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.tbtn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 12px;font-size:14px;white-space:nowrap}
.tbtn b{background:var(--accent);color:var(--onacc);border-radius:10px;padding:0 6px;margin-left:4px;font-size:12px}

@media(min-width:1100px){
 .bottom{display:none}
 .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px}
 .side .sbrand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;padding:0 8px 16px}
 .side .sbrand svg{width:26px;height:26px}
 .side .navbtn{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:15px}
 .side .navbtn.on{background:var(--surface2)}
 main{padding-bottom:40px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--onacc);border-color:transparent}
.btn.danger{background:#c62828;color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onacc);font-size:32px;line-height:1;box-shadow:0 4px 14px #0008;display:grid;place-items:center}
html:not([data-tab=library]) .fab{display:none}
@media(min-width:1100px){.fab{bottom:28px;right:28px}}

/* hero */
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.hsym{flex:none;width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-size:28px}
.hero h1{font-size:20px}
.hero .tagline{color:var(--muted);font-size:14px}
.hero .greet{margin-top:4px;font-weight:600;color:var(--accent)}
.hstats{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.hstats b{display:block;font-size:22px;color:var(--text)}
@media(max-width:520px){.hstats{display:none}}

.resbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px;color:var(--muted);font-size:14px}
.fchip{background:var(--surface2);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;color:var(--text)}
.fchip button{color:var(--muted);padding:0 6px;font-size:14px}

/* game cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cover{aspect-ratio:16/10;background:var(--surface2);position:relative;overflow:hidden}
.cover img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;font-weight:800;font-size:28px;color:#ffffffcc;letter-spacing:1px}
.cmeta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.ctitle{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chip{background:var(--c,#555);color:#fff;border-radius:6px;padding:1px 6px;font-weight:600;font-size:11px;text-shadow:0 1px 2px #0006}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:var(--surface2);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
.tag.sub{color:var(--accent2)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;grid-column:1/-1}

/* sheets */
.sheet-back{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92dvh;background:var(--bg);border:1px solid var(--border);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:20px;max-height:88dvh}}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.sheet-head h2{flex:1;font-size:18px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:16px}
.sheet-body{overflow:auto;padding:14px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.sheet-foot:empty{display:none}
.sheet-foot .btn{flex:1}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--onacc)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;width:100%;color:var(--text)}
.field select option,.field select optgroup{background:var(--surface);color:var(--text)}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:var(--surface2)}
.msg.warn{background:#6d4c00;color:#ffe9b0}
.msg.bad{background:#7f1d1d;color:#ffd6d6}
.res{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px}
.res .thumb{width:72px;height:50px;border-radius:8px;overflow:hidden;flex:none;background:var(--surface2)}
.res .thumb img{width:100%;height:100%;object-fit:cover}
.res b{display:block;font-size:15px}
.res span{font-size:12px;color:var(--muted)}
.attr{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.big{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--surface2)}
.big img,.big .ph{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--surface);margin-bottom:6px;border:1px solid var(--border)}
.opt.on{border-color:var(--accent);color:var(--accent)}
.gname{font-size:13px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.th{display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:12px;border:2px solid var(--border);background:var(--surface)}
.th.on{border-color:var(--accent)}
.sw{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.th b{display:block;font-size:14px}.th small{color:var(--muted);font-size:11px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));z-index:80;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 4px 14px #0008;max-width:90vw}

/* household */
.people{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.people{grid-template-columns:1fr 1fr}}
.pcard{border-radius:20px;padding:16px;background:linear-gradient(135deg,var(--p2),var(--p1));color:var(--pt);border:1px solid #ffffff30}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:52px;height:52px;border-radius:16px;background:var(--pa);color:var(--po);display:grid;place-items:center;font-size:26px;flex:none}
.pname{font-size:20px;font-weight:700}
.psub{font-size:13px;opacity:.75}
.pstats{display:flex;gap:16px;margin-bottom:12px;font-size:13px;opacity:.85}
.pstats b{display:block;font-size:20px}
.favs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.fav{border-radius:10px;overflow:hidden;background:#0004;text-align:center;font-size:11px}
.fav .cover{aspect-ratio:1}
.fav div.t{padding:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.favnone{opacity:.7;font-size:13px;margin-bottom:12px}

/* consoles */
.sect{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.ctiles{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.ctiles{grid-template-columns:repeat(6,1fr)}}
.ctile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.ctile.own{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.ctile svg{width:48px;height:48px}
.ctile:not(.own) svg{filter:grayscale(1);opacity:.35}
.ctile .nm{font-size:13px;font-weight:600;line-height:1.2}
.ctile .ct{font-size:12px;color:var(--muted)}
.ctile .own-btn{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-top:2px}
.ctile.own .own-btn{background:var(--c);color:#fff}
.albhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.albhead svg{width:44px;height:44px}
.albhead h2{font-size:20px}
.albhead .sub{color:var(--muted);font-size:14px}
.back{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-weight:600}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px}
@media(min-width:700px){.album{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.album{grid-template-columns:repeat(6,1fr)}}
.slot{aspect-ratio:1/1.25;border:2px dashed var(--border);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:28px;background:#ffffff08}
.sticker{position:relative;aspect-ratio:1/1.25;background:#fff;border-radius:12px;padding:5px;box-shadow:0 2px 6px #0007;transform:rotate(var(--rot,0deg));display:flex;flex-direction:column;text-align:left;color:#111}
.sticker .img{flex:1;border-radius:8px;overflow:hidden;min-height:0}
.sticker .img img,.sticker .img .ph{width:100%;height:100%;object-fit:cover}
.sticker .cap{font-size:11px;line-height:1.2;padding:4px 2px 1px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sticker .by{position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--onacc);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.pager span{color:var(--muted)}

/* settings */
.set{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.set h3{font-size:16px;margin-bottom:8px}
.set p{color:var(--muted);font-size:14px;margin-bottom:10px}
.set .btns{display:flex;flex-wrap:wrap;gap:8px}
.ver{font-weight:700;font-size:18px}

/* sign in */
.login{margin:auto;text-align:center;padding:30px 20px;max-width:360px}
.login svg{width:90px;height:90px;margin-bottom:10px}
.login h1{font-size:28px;margin-bottom:4px}
.login p{color:var(--muted);margin-bottom:20px}
.setupbox{max-width:560px;margin:auto;padding:24px 18px;line-height:1.5}
.setupbox code{background:var(--surface2);padding:1px 6px;border-radius:6px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 10px}

/* console stickers */
.sticker.cs .img{display:grid;place-items:center;padding:12%}
.sticker.cs .img svg{width:100%;height:100%}
.slot.cs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:11px;line-height:1.2;text-align:center;color:var(--muted)}
.slot.cs svg{width:55%;filter:grayscale(1);opacity:.3}
.slot.blank{border-style:dotted;opacity:.4}

</style>
</head>

<script>
/* Red error bar + optional ?debug=1 tap logger. Runs before the app so even load failures show. */
(function(){
  var bar=null,msgs=[];
  function show(m){
    msgs.push(String(m));
    if(msgs.length>20)msgs.shift();
    if(!document.body){document.addEventListener('DOMContentLoaded',function(){show(m)});return}
    if(!bar){
      bar=document.createElement('div');bar.id='errbar';bar.setAttribute('role','alert');
      bar.innerHTML='<span id="errtxt"></span><button type="button" id="errcopy">Copy</button><button type="button" id="errx" aria-label="Dismiss">✕</button>';
      document.body.appendChild(bar);
      document.getElementById('errx').onclick=function(){bar.remove();bar=null;msgs=[]};
      document.getElementById('errcopy').onclick=function(){try{navigator.clipboard.writeText(msgs.join('\n'))}catch(e){}};
    }
    document.getElementById('errtxt').textContent='Error: '+msgs[msgs.length-1]+(msgs.length>1?'  (+'+(msgs.length-1)+' more)':'');
    if(window.__spLog)window.__spLog('ERROR '+m);
  }
  window.__spErr=show;
  window.addEventListener('error',function(e){
    var t=e.target;
    if(t&&t!==window&&t.tagName){
      if(t.tagName==='SCRIPT')show('Could not load app code ('+(t.src||'inline module')+'). Is the network on?');
      else if(t.tagName==='LINK')show('Could not load '+(t.href||'a file'));
      return; /* broken images are handled by the app */
    }
    show((e.message||'Unknown error')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''));
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;show('Promise: '+(r&&r.message?r.message:String(r)));
  });
  if(/[?&]debug=1/.test(location.search)){
    var lines=[],pre,panel;
    function build(){
      panel=document.createElement('div');panel.id='dbg';
      panel.innerHTML='<div class="bar"><b>debug</b><button type="button" data-d="copy">Copy</button><button type="button" data-d="clear">Clear</button><button type="button" data-d="hide">Hide</button></div><pre></pre>';
      document.body.appendChild(panel);pre=panel.querySelector('pre');
      panel.addEventListener('click',function(e){
        var d=e.target.getAttribute&&e.target.getAttribute('data-d');
        if(d==='clear'){lines=[];pre.textContent=''}
        if(d==='copy'){try{navigator.clipboard.writeText(lines.join('\n'))}catch(x){}}
        if(d==='hide'){panel.remove();panel=null}
        e.stopPropagation();
      },true);
    }
    window.__spLog=function(t){
      var s=new Date().toISOString().slice(11,23)+' '+t;lines.push(s);if(lines.length>300)lines.shift();
      if(!document.body)return;
      if(!panel)return;
      pre.textContent=lines.join('\n');pre.scrollTop=pre.scrollHeight;
    };
    function desc(el){
      if(!el||!el.tagName)return '?';
      var s=el.tagName.toLowerCase();
      if(el.id)s+='#'+el.id;
      if(el.className&&typeof el.className==='string')s+='.'+el.className.trim().split(/\s+/).slice(0,2).join('.');
      var a=el.attributes;
      for(var i=0;i<a.length;i++){if(a[i].name.indexOf('data-')===0)s+='['+a[i].name+'='+a[i].value+']'}
      var tx=(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,28);
      return s+(tx?' "'+tx+'"':'');
    }
    document.addEventListener('DOMContentLoaded',function(){
      build();window.__spLog('debug on. UA '+navigator.userAgent.slice(0,80));
    });
    ['click','pointerdown'].forEach(function(ev){
      document.addEventListener(ev,function(e){
        if(e.target&&e.target.closest&&e.target.closest('#dbg'))return;
        var t=e.target,c=t.closest?t.closest('button,[data-action],[data-tab],a,input,select,textarea,label'):null;
        window.__spLog(ev+' '+desc(c||t)+(c&&c!==t?' (hit <'+(t.tagName||'?').toLowerCase()+'>)':'')+' @'+Math.round(e.clientX)+','+Math.round(e.clientY));
      },true);

function uniq(arr) { return [...new Set(arr.filter(Boolean))]; }
function openFilters() {

}

/* RAWG */
async function rawg(path, params = {}) {
  const key = S.rawgKey; if (!key) { const e = new Error("nokey"); throw e; }
  const u = new URL("https://api.rawg.io/api/" + path); u.searchParams.set("key", key);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const r = await fetch(u.toString());
  if (!r.ok) { const e = new Error("RAWG " + r.status); e.status = r.status; throw e; }
  return r.json();
}
function friendly(e) {
  if (e.message === "nokey") return "Add your RAWG key in Settings first, or add the game by hand.";
  if (e.status === 401 || e.status === 403) return "RAWG did not accept the key. Check it in Settings.";
  if (e.status === 429) return "The RAWG monthly limit has been reached.";
  return "Could not reach RAWG. Check the connection, or add the game by hand.";
}
function mapResult(r) {
  const plats = (r.platforms || []).map(p => p.platform && p.platform.name).filter(Boolean);
  const keys = uniq(plats.map(mapPlat));
  return { rawgId: r.id, title: r.name || "", year: r.released ? String(r.released).slice(0, 4) : "", cover: r.background_image || "", genres: (r.genres || []).map(g => g.name), suggested: keys, platShort: keys.slice(0, 4).map(k => PLAT[k].s).join(", ") };
}
async function doSearch() {
  const a = S.add; if (!a) return;
  const q = (($("#addq") || {}).value || "").trim(); if (q.length < 2) return;
  a.q = q; a.busy = true; a.msg = ""; const tok = ++a.token; paintResults();
  try {
    const j = await rawg("games", { search: q, page_size: 12 });
    if (S.add !== a || tok !== a.token) return;
    a.results = (j.results || []).map(mapResult);
    if (!a.results.length) a.msg = "No matches. Try fewer words, or add it by hand.";
  } catch (e) { if (S.add !== a || tok !== a.token) return; a.results = []; a.msg = friendly(e); log("rawg search failed " + e.message); }
  a.busy = false; paintResults();
}
async function fillDetail(id) {
  try {
    const j = await rawg("games/" + id);
    const a = S.add; if (!a || a.mode !== "form" || !a.draft || a.draft.rawgId !== id) return;
    const pub = (j.publishers || []).map(p => p.name).join(", ") || (j.developers || []).map(p => p.name).join(", ");
    const el = $("#f_publisher"); if (el && !el.value.trim() && pub) el.value = pub;
  } catch (e) { log("detail failed " + e.message); }
}
function pickResult(i) {
  const a = S.add, r = a && a.results[i]; if (!r) return;
  a.fromResults = true; a.mode = "form"; a.dupOk = false;
  a.draft = { title: r.title, platform: r.suggested.length === 1 ? r.suggested[0] : (a.presetPlatform || ""), suggested: r.suggested, year: r.year, publisher: "", genres: r.genres.join(", "), cover: r.cover, subscription: false, subName: "", notes: "", rawgId: r.rawgId };
  paintAdd(); fillDetail(r.rawgId);
}

/* Save */
function saveGame() {
  const a = S.add; if (!a) return;
  const d = readForm();
  if (!d.title) return formMsg("Please enter a title.");
  if (!d.platform) return formMsg("Please choose a platform.");
  let year = null;
  if (d.year) { year = parseInt(d.year, 10); if (!/^\d{4}$/.test(d.year) || year < 1950 || year > 2100) return formMsg("Year should be four digits, like 2001."); }
  const key = norm(d.title);
  const same = S.games.filter(g => g.titleKey === key && g.id !== a.editId);
  if (same.some(g => g.platform === d.platform)) return formMsg(`Already in your library on ${esc(PLAT[d.platform].l)}.`);
  if (same.length && !a.dupOk) {
    a.dupOk = true; formMsg(`Another version is already saved (${esc(same.map(g => PLAT[g.platform] ? PLAT[g.platform].l : "Other").join(", "))}). Tap "Add anyway" to save this one too.`, "warn");
    const b = $("#saveBtn"); if (b) b.textContent = a.editId ? "Save anyway" : "Add anyway"; return;
  }
  const data = {
    title: d.title, platform: d.platform, year, publisher: d.publisher, genres: d.genres.split(",").map(x => x.trim()).filter(Boolean),
    cover: d.cover, subscription: d.subscription, subName: d.subscription ? d.subName : "", notes: d.notes,
    rawgId: (a.draft && a.draft.rawgId) || null
  };
  if (a.editId) {
    updateDoc(doc(db, "games", a.editId), data).catch(e => showErr("Save failed: " + e.message));
    toast("Changes saved");
  } else {
    addDoc(collection(db, "games"), { ...data, addedBy: me(), addedByName: S.user.displayName || PEOPLE[me()] || "", addedAt: Date.now() }).catch(e => showErr("Save failed: " + e.message));
    toast("Saved to library");
  }
  closeSheet();
}
function deleteGame(id, btn) {
  if (S.pendingDelete !== id) { S.pendingDelete = id; btn.textContent = "Tap again to delete"; setTimeout(() => { if (S.pendingDelete === id && btn.isConnected) { S.pendingDelete = null; btn.textContent = "Delete"; } }, 4000); return; }
  deleteDoc(doc(db, "games", id)).catch(e => showErr("Delete failed: " + e.message));
  closeSheet(); toast("Deleted");
}

/* ===================== CONSOLES: one shared sticker album, consoles only ===================== */
function consolesHtml() {
  const total = PLATFORMS.length, own = PLATFORMS.filter(p => S.owned[p.k]).length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  S.cpage = Math.min(Math.max(0, S.cpage), pages - 1);
  const slice = PLATFORMS.slice(S.cpage * PAGE_SIZE, (S.cpage + 1) * PAGE_SIZE);
  const rots = [-1.6, 1.1, -0.7, 1.7, -1.2, 0.8];
  let cells = slice.map((p, i) => S.owned[p.k]
    ? `<button type="button" class="sticker cs" style="--rot:${rots[i % rots.length]}deg" data-action="open-console" data-k="${p.k}"><div class="img" style="background:${p.c}33">${consoleIcon(p.t, p.c)}</div><div class="cap">${esc(p.l)}</div></button>`
    : `<button type="button" class="slot cs" data-action="open-console" data-k="${p.k}">${consoleIcon(p.t, p.c)}<span>${esc(p.l)}</span></button>`).join("");
  for (let i = slice.length; i < PAGE_SIZE; i++) cells += `<div class="slot blank"></div>`;
  return `<div class="albhead"><div style="flex:1"><h2>Console album</h2><div class="sub">${own} of ${total} consoles in the house</div></div></div>
<div class="album">${cells}</div>
<div class="pager"><button type="button" class="btn sm" data-action="console-page" data-d="-1"${S.cpage <= 0 ? " disabled" : ""}>\u2190</button><span>Page ${S.cpage + 1} of ${pages}</span><button type="button" class="btn sm" data-action="console-page" data-d="1"${S.cpage >= pages - 1 ? " disabled" : ""}>\u2192</button></div>`;

function openConsole(k) {
  const p = PLAT[k]; if (!p) return;

  return `<div class="set"><h3>App version</h3><div class="ver">App version ${APP_VERSION}</div><p style="margin:6px 0 0">If something looks old, close and reopen the app once.</p></div>
<div class="set"><h3>Account</h3><p>Signed in as ${esc(S.user.displayName || "")} (${esc(S.user.email || "")}).</p><div class="btns"><button type="button" class="btn sm" data-action="signout">Sign out</button></div></div>
<div class="set"><h3>My card and theme</h3><p>Current theme: ${esc(t.name)}.</p><div class="btns"><button type="button" class="btn sm primary" data-action="edit-card">Change nickname, favourites and theme</button></div></div>
<div class="set"><h3>Game database (RAWG)</h3><p>Used for search, covers and details. Paste the key once; it is saved for both of you.</p>
<div class="field"><label for="rawgkey">RAWG key</label><input id="rawgkey" type="password" autocomplete="off" value="${esc(S.rawgKey)}"></div>
<div class="btns"><button type="button" class="btn sm primary" data-action="save-key">Save key</button><button type="button" class="btn sm" data-action="test-key">Test key</button></div>
<p id="keyStatus" style="margin-top:8px"></p>
<p style="margin-top:12px">Automatic tools only fill empty fields and never change what you edited. Only exact title matches are used.</p>
<div class="btns"><button type="button" class="btn sm" data-action="auto-covers">Assign covers automatically</button><button type="button" class="btn sm" data-action="auto-match">Match games with RAWG</button><button type="button" class="btn sm ghost" data-action="stop-auto">Stop</button></div>
<p id="autoStatus" style="margin-top:8px"></p></div>
<div class="set"><h3>Backup</h3><p>Saves all games, cards and owned consoles to a file on this device.</p><div class="btns"><button type="button" class="btn sm primary" data-action="export">Export JSON backup</button></div></div>
<div class="set"><h3>About</h3><p>Game data and images from <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a>. Add ?debug=1 to the web address to see a tap log.</p></div>`;
}
function setStatus(id, txt) { const el = $("#" + id); if (el) el.textContent = txt; }
async function testKey() {
  S.rawgKey = (($("#rawgkey") || {}).value || "").trim();
  setStatus("keyStatus", "Testing…");
  try { const j = await rawg("games", { search: "zelda", page_size: 1 }); setStatus("keyStatus", (j.results && j.results.length) ? "Key works." : "Key accepted, but no results came back."); }
  catch (e) { setStatus("keyStatus", friendly(e)); }
}
function saveKey() {
  const k = (($("#rawgkey") || {}).value || "").trim();
  S.rawgKey = k; ls.set("sp_rawg", k);
  setDoc(doc(db, "gamesMeta", "household", "config", "main"), { rawgKey: k }, { merge: true }).catch(e => showErr("Save failed: " + e.message));
  setStatus("keyStatus", k ? "Key saved." : "Key removed."); toast("Saved");
}
async function autoMatch(mode) {
  if (S.auto && S.auto.run) return setStatus("autoStatus", "Already running.");
  if (!S.rawgKey) return setStatus("autoStatus", friendly(new Error("nokey")));
  S.auto = { run: true, stop: false };
  const list = S.games.filter(g => mode === "covers" ? !g.cover : (!g.rawgId || !(g.genres || []).length || !g.year || !g.publisher));
  if (!list.length) { S.auto = null; return setStatus("autoStatus", "Nothing to fill in."); }
  let done = 0, upd = 0, miss = 0, stopped = "";
  for (const g of list) {
    if (S.auto.stop) { stopped = " (stopped)"; break; }
    try {
      let info = null;
      if (g.rawgId) info = await rawg("games/" + g.rawgId);
      else {
        const j = await rawg("games", { search: g.title, page_size: 5 });
        const hit = (j.results || []).find(r => norm(r.name) === g.titleKey);
        if (hit) info = mode === "covers" ? hit : await rawg("games/" + hit.id);
      }
      if (!info) miss++;
      else {
        const patch = {};
        if (!g.cover && info.background_image) patch.cover = info.background_image;
        if (mode === "match") {
          if (!g.rawgId) patch.rawgId = info.id;
          if (!g.year && info.released) patch.year = parseInt(String(info.released).slice(0, 4), 10);
          if (!(g.genres || []).length && (info.genres || []).length) patch.genres = info.genres.map(x => x.name);
          if (!g.publisher) { const pub = (info.publishers || []).map(p => p.name).join(", "); if (pub) patch.publisher = pub; }
        }
        if (Object.keys(patch).length) { updateDoc(doc(db, "games", g.id), patch).catch(e => showErr("Update failed: " + e.message)); upd++; } else miss++;
      }
    } catch (e) {
      if (e.message === "nokey" || [401, 403, 429].includes(e.status)) { setStatus("autoStatus", friendly(e)); S.auto = null; return; }
      miss++;
    }
    done++; setStatus("autoStatus", `${done} of ${list.length} checked…`); await sleep(150);
  }
  S.auto = null;
  setStatus("autoStatus", `Done${stopped}: ${upd} updated, ${miss} left as they were (no exact match or nothing to add).`);
}
function exportJson() {
  const data = { app: "SavePoint", version: APP_VERSION, exportedAt: new Date().toISOString(), games: S.games.map(g => { const { _h, titleKey, ...rest } = g; return rest; }), members: S.members, consolesOwned: S.owned };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `savepoint-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Backup saved");
}

/* ===================== AUTH + DATA LISTENERS ===================== */
function showCentered(html) { hideShell(); $("#view").innerHTML = html; }
function showSetup() {
  showCentered(`<div class="setupbox"><h1>One step left</h1><p>SavePoint needs your Firebase details. They are the same ones Musicbox uses.</p><ol><li>Open your Musicbox <code>index.html</code> in a text editor.</li><li>Search for <code>firebaseConfig</code> and copy the block with <code>apiKey</code>, <code>messagingSenderId</code> and <code>appId</code>.</li><li>Open this app's <code>index.html</code>, find <code>FIREBASE_CONFIG</code> near the top, and paste those three values over the <code>PASTE_</code> words.</li></ol></div>`);
}
function showLogin(msg = "") {
  showCentered(`<div class="login">${crystalSvg()}<h1>SavePoint</h1><p>A private game library for two.</p><button type="button" class="btn primary" data-action="signin">Sign in with Google</button>${msg ? `<div class="msg bad" style="margin-top:16px">${esc(msg)}</div>` : ""}</div>`);
}
function showDenied(user) {
  const why = !user.emailVerified ? "This Google account's email is not verified." : "This Google account is not on the household list.";
  showCentered(`<div class="login">${crystalSvg()}<h1>No access</h1><p>${esc(why)}</p><button type="button" class="btn" data-action="signout">Sign out</button></div>`);
}
function stopListeners() { S.unsub.forEach(u => { try { u(); } catch (e) {} }); S.unsub = []; }
function fsError(e) {
  if (e && e.code === "permission-denied") showErr("Firestore says permission denied. Publish the SavePoint rules first (README, step 3).");
  else showErr("Database error: " + (e && e.message));
}
function startListeners() {
  stopListeners();
  S.unsub.push(onSnapshot(collection(db, "games"), snap => {
    S.games = snap.docs.map(d => ({ id: d.id, ...d.data() })); rebuildIndex();
    if (S.tab === "library") updateLibrary(); else if (!sheetOpen()) renderView();
  }, fsError));
  S.unsub.push(onSnapshot(collection(db, "gamesMeta", "household", "members"), snap => {
    S.members = {}; snap.docs.forEach(d => { S.members[d.id] = d.data(); });
    const mine = S.members[me()];
    if (!mine && !S.gotMembers) setDoc(doc(db, "gamesMeta", "household", "members", me()), { name: S.user.displayName || PEOPLE[me()] || "", nickname: "", theme: S.theme || "crystal", favs: [] }, { merge: true }).catch(fsError);
    S.gotMembers = true;
    if (mine && mine.theme && mine.theme !== S.theme) applyTheme(mine.theme);
    rebuildIndex(); if (!sheetOpen()) renderView(); else updateLibrary();
  }, fsError));
  S.unsub.push(onSnapshot(doc(db, "gamesMeta", "household", "config", "main"), snap => {
    const d = snap.exists() ? snap.data() : {}; S.cfg = d;
    if (d.rawgKey) { S.rawgKey = d.rawgKey; ls.set("sp_rawg", d.rawgKey); }
  }, fsError));
  S.unsub.push(onSnapshot(doc(db, "gamesMeta", "household", "config", "consoles"), snap => {
    S.owned = (snap.exists() && snap.data().owned) || {};
    if (!sheetOpen()) renderView(); else updateLibrary();
  }, fsError));
}
function onUser(user) {
  if (!user) { stopListeners(); S.user = null; showLogin(); return; }
  if (!user.emailVerified || !PEOPLE[user.uid]) { stopListeners(); S.user = null; showDenied(user); return; }
  S.user = user; applyTheme(S.theme); showShell(); startListeners(); setTab(S.tab);
}
async function signIn() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    log("signin " + (e && e.code));
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { try { await signInWithRedirect(auth, new GoogleAuthProvider()); return; } catch (x) { e = x; } }
    if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) return;
    showLogin("Sign in failed: " + (e && (e.message || e.code)));
  }
}

/* ===================== EVENTS ===================== */
document.addEventListener("click", e => {
  const tb = e.target.closest("button[data-tab]");
  if (tb) { setTab(tb.dataset.tab); return; }
  const sb = e.target.closest(".sheet-back");
  if (e.target === sb) { closeSheet(); return; }
  const el = e.target.closest("[data-action]"); if (!el) return;
  act(el.dataset.action, el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetOpen()) closeSheet();
  if (e.key === "Enter" && e.target && e.target.id === "addq") { e.preventDefault(); doSearch(); }
});
let searchTimer = null, addTimer = null;
document.addEventListener("input", e => {
  const id = e.target && e.target.id;
  if (id === "q") { S.q = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(updateLibrary, 120); }
  else if (id === "addq") { clearTimeout(addTimer); const v = e.target.value.trim(); if (v.length >= 3) addTimer = setTimeout(doSearch, 700); }
  else if (id === "f_title" && S.add) { S.add.dupOk = false; const b = $("#saveBtn"); if (b) b.textContent = S.add.editId ? "Save changes" : "Save to library"; }
});
document.addEventListener("change", e => {
  const id = e.target && e.target.id;
  if (id === "f_sub") { const r = $("#subrow"); if (r) r.hidden = !e.target.checked; }
  if (id === "f_platform" && S.add) { S.add.dupOk = false; const b = $("#saveBtn"); if (b) b.textContent = S.add.editId ? "Save changes" : "Save to library"; formMsg(""); }
});

function act(name, el) {
  switch (name) {
    case "signin": return signIn();
    case "signout": return signOut(auth).catch(e => showErr(e.message));
    case "close-sheet": return closeSheet();
    case "open-add": return openAdd();
    case "add-mode": { const a = S.add; if (!a) return; if (a.mode === "form" && $("#f_title")) a.draft = { ...(a.draft || {}), ...readForm() }; a.mode = el.dataset.v; a.dupOk = false; paintAdd(); return; }
    case "pick-result": return pickResult(+el.dataset.i);
    case "save-game": return saveGame();
    case "open-game": { const id = el.dataset.id; closeSheet(); return openGame(id); }
    case "edit-game": { const id = el.dataset.id; closeSheet(); return openAdd({ editId: id }); }
    case "delete-game": return deleteGame(el.dataset.id, el);
    case "open-sort": return openSort();
    case "set-sort": S.sort = el.dataset.v; ls.set("sp_sort", S.sort); closeSheet(); return updateLibrary();
    case "open-filters": return openFilters();
    case "apply-filters": for (const k of Object.keys(S.f)) S.f[k] = (($("#f_" + k) || {}).value || ""); closeSheet(); return updateLibrary();
    case "clear-filters": for (const k of Object.keys(S.f)) S.f[k] = ""; closeSheet(); return updateLibrary();
    case "clear-filter": S.f[el.dataset.k] = ""; return updateLibrary();
    case "open-console": return openConsole(el.dataset.k);
    case "console-page": S.cpage += +el.dataset.d; return renderView();
    case "show-console-games": { const k = el.dataset.k; closeSheet(); S.f = { platform: k, genre: "", decade: "", publisher: "", by: "", sub: "" }; S.q = ""; const q = $("#q"); if (q) q.value = ""; return setTab("library"); }
    case "toggle-console": {
      const k = el.dataset.k, v = !S.owned[k]; S.owned = { ...S.owned, [k]: v }; if (el.dataset.sheet) closeSheet(); renderView();
      return setDoc(doc(db, "gamesMeta", "household", "config", "consoles"), { owned: { [k]: v } }, { merge: true }).catch(e => showErr("Save failed: " + e.message));
    }
    case "edit-card": return openCardEditor();
    case "pick-theme": { S.draftTheme = el.dataset.id; const p = $("#themepick"); if (p) p.innerHTML = themePickerHtml(S.draftTheme); return; }
    case "save-card": return saveCard();
    case "save-key": return saveKey();
    case "test-key": return testKey();
    case "auto-covers": return autoMatch("covers");
    case "auto-match": return autoMatch("match");
    case "stop-auto": if (S.auto) S.auto.stop = true; return;
    case "export": return exportJson();
  }
}

/* ===================== BOOT ===================== */
function boot() {
  log("boot v" + APP_VERSION);
  applyTheme(S.theme);
  if (/PASTE_/.test(JSON.stringify(FIREBASE_CONFIG))) return showSetup();
  app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app);
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch (e) { log("persistent cache failed: " + e.message); db = initializeFirestore(app, {}); }
  onAuthStateChanged(auth, onUser, e => showErr("Sign-in check failed: " + e.message));
}
try { boot(); } catch (e) { showErr("Start-up failed: " + (e && e.message)); }

</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(e){if(window.__spLog)window.__spLog('sw register failed '+e)});
  });
}
</script>
